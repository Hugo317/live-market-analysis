[project]
name = "live-market-analysis"
version = "0.1.0"
description = "Dashboard tracking stock-market data across Europe, the US and Asia with growth and region analysis"
readme = "README.md"
authors = [
    { name = "Hugo Caravlho", email = "hugomnc317@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "dash>=2.17.0",
    "lxml>=5.3.0",
    "yfinance>=0.2.40",
]

[project.scripts]
live-market-analysis = "live_market_analysis:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
